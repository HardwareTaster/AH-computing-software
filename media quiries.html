<html>
<head>
<style>

    @media screen and (min-width: 1000px) {
    .example1{
        display:none;
    }
}
@media screen and (min-width: 500px) {
    .example2{
        display:none;
    }
}
@media screen and (min-width: 100px) {
    .example3{
        display:none;
    }
}


</style>
</head>
<body>
<div class="example1">
This is desktop mode.
</div>
<div class="example2">
This is tablet mode.
</div>
<div class="example3">
This is smartphone mode.
</div>
</body>
</html>
