<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debugging Media Queries</title>
    <style>
      /* Base styles */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

header,
footer {
  background-color: #333;
  color: white;
  text-align: center;
  padding: 10px;
}

main {
  display: flex;
  justify-content: space-between;
  padding: 10px;
}

.content {
  flex: 2;
  background-color: #f4f4f4;
  padding: 10px;
}

.sidebar {
  flex: 1;
  background-color: #ddd;
  padding: 10px;
}

/* Media query for small screens */
media screen and (max-width: 768px) {
  body {
    font-size: 18px; /* Make text larger for smaller screens */
  }
}

/* Media query for hiding sidebar */
@media screen and (max-width: 600) {
  .sidebar {
    display: none;
  }
}

/* Media query for changing header color */
@media screen and (max-width: 480px) {
  header {
    background-color: #555;
  }
}
    </style>
  </head>
  <body>
    <header>
      <h1>Welcome to the Debugging Activity</h1>
    </header>
    <main>
      <section class="content">
        <p>This is some main content.</p>
      </section>
      <aside class="sidebar">
        <p>This is the sidebar.</p>
      </aside>
    </main>
    <footer>
      <p>Footer content here.</p>
    </footer>
  </body>
</html>
